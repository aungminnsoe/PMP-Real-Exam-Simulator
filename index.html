<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PMP Simulator</title>

<style>
:root{
--c1:#1469A7;
--bg:#FFFDF5;
--bar1:#c97a7a;
--bar2:#c9b96f;
--bar3:#6fbf8f;
--bar4:#3a9b6a;
}

body{margin:0;font-family:Arial;background:var(--bg);}

.header{
background:var(--c1);
color:#fff;
padding:10px;
display:flex;
justify-content:space-between;
}

.toolbar{
background:#97B2D5;
padding:6px 10px;
font-size:12px;
}

.main{padding:20px;max-width:900px;margin:auto;}

.option{padding:6px;cursor:pointer;}
.option:hover{background:#E7FEFF;}
.selected{font-weight:bold;}

.navgrid{
display:grid;
grid-template-columns:repeat(10,1fr);
gap:5px;
padding:10px;
}

.navcell{
padding:6px;
border:1px solid #ccc;
text-align:center;
cursor:pointer;
font-size:12px;
}

.flag{background:#FAFF49;}

.bar{
display:flex;
height:20px;
border-radius:10px;
overflow:hidden;
position:relative;
}

.seg{flex:1;}
.b1{background:var(--bar1);}
.b2{background:var(--bar2);}
.b3{background:var(--bar3);}
.b4{background:var(--bar4);}

.pointer{
position:absolute;
top:-8px;
border-left:6px solid transparent;
border-right:6px solid transparent;
border-bottom:10px solid #000;
}
</style>

</head>

<body>
<div id="app"></div>

<script>

/* ===== SAMPLE DATA (REPLACE LATER) ===== */
const ALL_QUESTIONS = [
{
type:"mcq",
q:"A project is delayed. What should PM do first?",
options:["Ignore","Escalate","Analyze root cause","Replace team"],
answer:2,
domain:"Process"
},
{
type:"mcq",
q:"Team conflict arises. What should PM do?",
options:["Ignore","Facilitate discussion","Escalate","Replace team"],
answer:1,
domain:"People"
}
];

/* ===== STATE ===== */
let Q=[],cur=0,ans=[],flag=[];
let time=0,timer;

/* ===== START ===== */
function startScreen(){
app.innerHTML=`
<div style="text-align:center;margin-top:100px">
<h2>PMP Simulator</h2>
<button onclick="start(15)">15</button>
<button onclick="start(30)">30</button>
<button onclick="start(60)">60</button>
<button onclick="start(90)">90</button>
<button onclick="start(180)">180</button>
</div>`;
}

function start(n){
Q=shuffle(ALL_QUESTIONS).slice(0,n);
ans=Array(n).fill(null);
flag=Array(n).fill(false);

time= n==180 ? 13800 : n*75;

startTimer();
render();
}

/* ===== TIMER ===== */
function startTimer(){
timer=setInterval(()=>{
time--;
if(time<=0) endExam();
},1000);
}

function t(){
let m=Math.floor(time/60);
let s=time%60;
return m+":"+String(s).padStart(2,'0');
}

/* ===== RENDER ===== */
function render(){

let q=Q[cur];

let html=`
<div class="header">
<div>PMP Sample Test</div>
<div>${cur+1}/${Q.length} | ${t()}</div>
</div>

<div class="toolbar">
Flag: <input type="checkbox" ${flag[cur]?"checked":""} onclick="toggleFlag()">
<button onclick="navigator()">Navigator</button>
</div>

<div class="main">
<div>${q.q}</div>
`;

q.options.forEach((o,i)=>{
html+=`<div class="option ${ans[cur]==i?"selected":""}" onclick="select(${i})">${String.fromCharCode(65+i)}. ${o}</div>`;
});

html+=`
<button onclick="prev()">Prev</button>
<button onclick="next()">Next</button>
</div>
`;

app.innerHTML=html;
}

/* ===== ACTIONS ===== */
function select(i){ans[cur]=i;render();}
function toggleFlag(){flag[cur]=!flag[cur];}

function next(){
if(cur<Q.length-1){
cur++;
checkBreak();
render();
}else review();
}

function prev(){if(cur>0){cur--;render();}}

/* ===== BREAK ===== */
function checkBreak(){
if(Q.length==180 && (cur==60||cur==120)){
alert("Break Time");
}
}

/* ===== NAVIGATOR ===== */
function navigator(){
let html='<div class="navgrid">';
for(let i=0;i<Q.length;i++){
html+=`<div class="navcell ${flag[i]?"flag":""}" onclick="go(${i})">${i+1}</div>`;
}
html+='</div>';
app.innerHTML=html;
}

function go(i){cur=i;render();}

/* ===== REVIEW ===== */
function review(){
let html="<h2>Review</h2>";
for(let i=0;i<Q.length;i++){
html+=`Q${i+1} - ${ans[i]==null?"❌":"✅"} ${flag[i]?"⚑":""}<br>`;
}
html+='<button onclick="endExam()">Submit Exam</button>';
app.innerHTML=html;
}

/* ===== SCORE ===== */
function endExam(){

let d={People:{c:0,t:0},Process:{c:0,t:0},Business:{c:0,t:0}};

Q.forEach((q,i)=>{
d[q.domain].t++;
if(ans[i]==q.answer) d[q.domain].c++;
});

function band(x){
let p=x.c/x.t;
if(p<0.5)return{l:"BT",pos:25};
if(p<0.65)return{l:"T",pos:50};
if(p<0.8)return{l:"AT",pos:70};
return{l:"AT",pos:85};
}

function row(name,x){
let b=band(x);
return`
<div>
${name} (${b.l})
<div class="bar">
<div class="seg b1"></div>
<div class="seg b2"></div>
<div class="seg b3"></div>
<div class="seg b4"></div>
<div class="pointer" style="left:${b.pos}%"></div>
</div>
</div>`;
}

app.innerHTML=`
<h2 style="text-align:center">Score Report</h2>
<h1 style="text-align:center">${ans.filter((a,i)=>a==Q[i].answer).length}/${Q.length}</h1>
${row("People",d.People)}
${row("Process",d.Process)}
${row("Business",d.Business)}
`;
}

/* ===== UTIL ===== */
function shuffle(a){return a.sort(()=>Math.random()-0.5);}

/* INIT */
startScreen();

</script>
</body>
</html>
