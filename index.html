<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PMP Simulator</title>

<style>
body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#fff;
}

/* HEADER */
.header{
background:#2c5d8a;
color:#fff;
padding:10px 20px;
display:flex;
justify-content:space-between;
font-size:14px;
}

/* TOOLBAR */
.toolbar{
background:#7f97b5;
padding:6px 20px;
font-size:12px;
display:flex;
gap:20px;
align-items:center;
}

/* MAIN */
.main{
max-width:1000px;
margin-left:60px;
margin-top:20px;
}

/* QUESTION */
.qtext{
font-size:16px;
margin-bottom:20px;
line-height:1.5;
}

/* OPTIONS */
.opt{
display:flex;
align-items:center;
gap:10px;
margin:10px 0;
cursor:pointer;
}
.opt:hover{background:#f5faff;}

/* RADIO */
.radio{
width:18px;
height:18px;
border:2px solid #444;
border-radius:50%;
}
.radio.checked{
background:#444;
}

/* LABEL */
.lbl{
font-weight:bold;
width:20px;
}

/* BUTTON */
.btn{
margin-top:10px;
padding:4px 10px;
font-size:12px;
}

/* NAV GRID */
.grid{
display:grid;
grid-template-columns:repeat(10,1fr);
gap:5px;
padding:20px;
}
.cell{
border:1px solid #ccc;
padding:6px;
text-align:center;
cursor:pointer;
font-size:12px;
}
.flag{background:#FAFF49;}
.ans{background:#cce5cc;}

/* SCORE */
.row{
display:flex;
align-items:center;
gap:10px;
margin:15px 0;
}
.bar{
flex:1;
height:20px;
display:flex;
border-radius:10px;
overflow:hidden;
position:relative;
}
.seg{flex:1;}
.s1{background:#c97a7a;}
.s2{background:#c9b96f;}
.s3{background:#6fbf8f;}
.s4{background:#3a9b6a;}
.pointer{
position:absolute;
top:-8px;
border-left:6px solid transparent;
border-right:6px solid transparent;
border-bottom:10px solid #000;
}
</style>
</head>

<body>
<div id="app"></div>

<script>

/* ===== DATA (200 QUESTIONS) ===== */
const ALL_QUESTIONS = (function(){

const base = [
{q:"A project is delayed. What should PM do first?",o:["Escalate","Analyze root cause","Replace team","Add resources"],a:1,d:"Process"},
{q:"Conflict between team members. What should PM do?",o:["Ignore","Facilitate discussion","Escalate","Replace"],a:1,d:"People"},
{q:"Stakeholder unhappy. What should PM do?",o:["Ignore","Meet and understand","Escalate","Delay"],a:1,d:"People"},
{q:"New regulation impacts project. What first?",o:["Update plan","Understand impact","Ignore","Escalate"],a:1,d:"Process"},
{q:"High risk identified. What next?",o:["Ignore","Analyze and mitigate","Escalate","Monitor"],a:1,d:"Process"},
{q:"Project misaligned with business. What do?",o:["Continue","Stop","Consult sponsor","Ignore"],a:2,d:"Business"},
{q:"Major change requested. What do?",o:["Accept","Reject","Follow change control","Escalate"],a:2,d:"Business"}
];

let res=[];
while(res.length<200){
  base.forEach(q=>{
    if(res.length<200){
      res.push({
        type:"mcq",
        q:q.q,
        options:q.o,
        answer:q.a,
        domain:q.d
      });
    }
  });
}

return shuffle(res);
})();

/* ===== STATE ===== */
let Q=[],cur=0,ans=[],flag=[],time=0,timer;

/* ===== START ===== */
function startScreen(){
app.innerHTML=`
<div style="text-align:center;margin-top:100px">
<h2>PMP Simulator</h2>
<button onclick="start(15)">15</button>
<button onclick="start(30)">30</button>
<button onclick="start(60)">60</button>
<button onclick="start(90)">90</button>
<button onclick="start(180)">180</button>
</div>`;
}

function start(n){
Q=shuffle(ALL_QUESTIONS).slice(0,n);
ans=Array(n).fill(null);
flag=Array(n).fill(false);
time = n==180?13800:n*75;
startTimer();
render();
}

/* ===== TIMER ===== */
function startTimer(){
timer=setInterval(()=>{
time--;
if(time<=0) endExam();
},1000);
}
function ft(){
let m=Math.floor(time/60);
let s=time%60;
return m+":"+String(s).padStart(2,'0');
}

/* ===== RENDER ===== */
function render(){
let q=Q[cur];

let html=`
<div class="header">
<div>PMP Sample Test - First Name Last Name</div>
<div>${cur+1}/${Q.length} | ${ft()}</div>
</div>

<div class="toolbar">
<span>Comment</span>
<span style="background:#FAFF49;padding:2px 6px">Highlight (J)</span>
<span>Strikethrough (W)</span>
<span>Calculator</span>
<span>⚑ <input type="checkbox" ${flag[cur]?"checked":""} onclick="toggleFlag()"></span>
<button onclick="nav()">Navigator</button>
</div>

<div class="main">
<div class="qtext">${q.q}</div>
`;

q.options.forEach((o,i)=>{
html+=`
<div class="opt" onclick="sel(${i})">
<div class="radio ${ans[cur]==i?'checked':''}"></div>
<div class="lbl">${String.fromCharCode(65+i)}.</div>
<div>${o}</div>
</div>`;
});

html+=`
<button class="btn" onclick="prev()">Prev</button>
<button class="btn" onclick="next()">Next</button>
</div>
`;

app.innerHTML=html;
}

/* ===== ACTIONS ===== */
function sel(i){ans[cur]=i;render();}
function toggleFlag(){flag[cur]=!flag[cur];}

function next(){
if(cur<Q.length-1){
cur++;
if(Q.length==180 && (cur==60||cur==120)) alert("Break Time");
render();
}else review();
}

function prev(){if(cur>0){cur--;render();}}

/* ===== NAV ===== */
function nav(){
let html='<div class="grid">';
for(let i=0;i<Q.length;i++){
html+=`<div class="cell ${flag[i]?"flag":""} ${ans[i]!=null?"ans":""}" onclick="go(${i})">${i+1}</div>`;
}
html+='</div>';
app.innerHTML=html;
}
function go(i){cur=i;render();}

/* ===== REVIEW ===== */
function review(){
let html="<h2>Review</h2>";
for(let i=0;i<Q.length;i++){
html+=`Q${i+1} ${ans[i]==null?"❌":"✅"} ${flag[i]?"⚑":""}<br>`;
}
html+='<button onclick="endExam()">Submit</button>';
app.innerHTML=html;
}

/* ===== SCORE ===== */
function endExam(){

let d={People:{c:0,t:0},Process:{c:0,t:0},Business:{c:0,t:0}};

Q.forEach((q,i)=>{
d[q.domain].t++;
if(ans[i]==q.answer) d[q.domain].c++;
});

function band(x){
let p=x.c/x.t;
if(p<0.5)return{l:"BT",p:25};
if(p<0.65)return{l:"T",p:50};
if(p<0.8)return{l:"AT",p:70};
return{l:"AT",p:85};
}

function row(name,x){
let b=band(x);
return`
<div class="row">
<div style="width:120px">${name} (${b.l})</div>
<div class="bar">
<div class="seg s1"></div>
<div class="seg s2"></div>
<div class="seg s3"></div>
<div class="seg s4"></div>
<div class="pointer" style="left:${b.p}%"></div>
</div>
</div>`;
}

app.innerHTML=`
<h2 style="text-align:center">Examination Score Report</h2>
<h1 style="text-align:center">${ans.filter((a,i)=>a==Q[i].answer).length}/${Q.length}</h1>
${row("People",d.People)}
${row("Process",d.Process)}
${row("Business",d.Business)}
`;
}

/* ===== UTIL ===== */
function shuffle(a){return a.sort(()=>Math.random()-0.5);}

startScreen();

</script>
</body>
</html>
